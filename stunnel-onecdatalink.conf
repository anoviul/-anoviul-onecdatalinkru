; ============================================================================
; stunnel для onecdatalink на машине 1С (старые Windows + платформа 8.3.5)
;
; Зачем: старая ОС/платформа не умеет TLS 1.2, который требует api.onecdatalink.ru.
; stunnel несёт СВОЙ современный OpenSSL и делает TLS 1.2 сам, а 1С ходит к нему
; по обычному HTTP на localhost.
;
; Схема:  1С-обработка (сборка *_для_старых_1С_*_прокси)  ->  http://127.0.0.1:8080
;         stunnel  ->  TLS 1.2  ->  https://api.onecdatalink.ru:443
;
; Токен идёт открыто ТОЛЬКО по 127.0.0.1 (внутри машины), дальше stunnel шифрует.
; ============================================================================

; --- глобальные параметры ---
debug = 4
output = stunnel-onecdatalink.log
; Запуск как службы Windows: в GUI stunnel меню "Service -> Install".

[onecdatalink]
client = yes
accept = 127.0.0.1:8080
connect = api.onecdatalink.ru:443
sni = api.onecdatalink.ru

; Проверка сертификата сервера. Шифрование само по себе от подмены не защищает:
; без проверки цепочки перехватчик встаёт посередине, забирает ключ доступа и
; может подсунуть базе поддельную команду. Хранилище доверия старой ОС здесь не
; используется - корень Let's Encrypt лежит рядом в файле isrgrootx1.pem.
;
; Файл isrgrootx1.pem должен лежать рядом со stunnel.exe. Он есть в архиве; если
; его нет, возьмите с https://letsencrypt.org/certs/isrgrootx1.pem
CAfile = isrgrootx1.pem
verifyChain = yes
checkHost = api.onecdatalink.ru

; Если сервер вдруг потребует более новый TLS — можно зафиксировать минимум:
; sslVersionMin = TLSv1.2
